<html lang="nl">

<head>

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12151a" />

    <link rel="preload" id="webassembly" />

</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Er ging iets mis.
        <a href="." class="reload">Herladen</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        // Kitchen-timer beep via Web Audio. Call with n=0 from a click to unlock audio on mobile.
        window.patatBeep = function (n) {
            const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
            const a = window.patatAudio = window.patatAudio || new C(); a.resume();
            for (let i = 0; i < n; i++) {
                const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + i * 0.35;
                o.frequency.value = 880; o.connect(g); g.connect(a.destination);
                g.gain.setValueAtTime(0.4, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
                o.start(t); o.stop(t + 0.3);
            }
            if (n > 0 && navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);
        };
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="patat-alarm.js"></script><script src="patat-buzz.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
